<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183B54"/>
      <stop offset="100%" stop-color="#132E42"/>
    </linearGradient>
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7B597"/>
      <stop offset="100%" stop-color="#9AA78A"/>
    </linearGradient>
    <linearGradient id="dustyBreeze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C9D2"/>
      <stop offset="100%" stop-color="#AEC0C9"/>
    </linearGradient>
  </defs>

  <!-- Circular Balance / Orbit ring: Represents holistic nervous system regulation and inner equilibrium -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#BDC0A8" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#132E42" stroke-width="0.5" opacity="0.2"/>

  <!-- Celestial / Regulation Nodes -->
  <circle cx="200" cy="28" r="3" fill="#9AA78A"/>
  <circle cx="340" cy="115" r="2.5" fill="#AEC0C9"/>
  <circle cx="368" cy="235" r="3" fill="#BDC0A8"/>

  <g id="phoenix-emblem" transform="translate(10, 5)">
    <!-- BACK WING - Far Wing (Dusty Blue & Sage Green peeking behind) -->
    <!-- Far Wing Tip 1 -->
    <path d="M165,150 C150,115 130,70 102,42 C98,38 93,42 96,47 C108,68 122,105 132,142 Z" fill="#AEC0C9" opacity="0.85"/>
    <!-- Far Wing Tip 2 -->
    <path d="M160,165 C148,135 132,95 112,72 C108,68 104,72 107,76 C120,98 135,130 142,165 Z" fill="#9AA78A" opacity="0.75"/>

