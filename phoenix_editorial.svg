    <!-- Crest Plume 2 - Delicate Crown Feather (Deep Navy) -->
    <path d="M208,92 C214,76 225,58 240,48 C243,46 244,50 241,53 C230,64 222,80 216,98 Z" fill="#132E42"/>
    <!-- Crest Plume 3 - Whispering Plume (Dusty Blue) -->
    <path d="M205,96 C210,84 218,72 228,64 C231,62 232,65 230,68 C222,76 216,88 212,100 Z" fill="#AEC0C9"/>

    <!-- Head, Eye & Slender Beak -->
    <!-- Head & Neck -->
    <path d="M198,102 C202,94 210,90 218,94 C224,97 232,102 242,105 C246,106 245,109 240,111 C231,114 224,118 220,126 C212,142 215,165 218,185 C210,172 198,154 196,134 C195,120 196,108 198,102 Z" fill="#132E42"/>
    <!-- Eye of Awareness (Micro negative space aperture) -->
    <circle cx="218" cy="103" r="1.5" fill="#FDFDFD"/>

    <!-- PROUD ARCHED CHEST & GRACEFUL BODY -->
    <!-- The feminine, confident torso curve -->
    <path d="M218,185 C226,204 230,226 224,248 C218,272 198,290 182,302 C176,306 172,302 175,296 C186,274 195,248 194,222 C193,202 186,188 182,175 C194,182 208,178 218,185 Z" fill="#132E42"/>

    <!-- Inner Heart Accent (Quiet light within the chest) -->
