    <!-- FLOWING CASCADING TAIL FEATHERS -->
    <!-- Plume 1: Central S-Curve Ribbon (Deep Navy) -->
    <path d="M182,302 C186,325 192,352 198,375 C200,381 195,384 192,378 C182,358 172,330 170,302 Z" fill="#132E42"/>

    <!-- Plume 2: Flowing Renewal Ribbon (Sage Green) -->
    <path d="M178,305 C180,332 178,362 168,386 C165,392 160,388 162,382 C170,358 172,330 170,305 Z" fill="#9AA78A"/>

    <!-- Plume 3: Calming Cascade (Dusty Blue) -->
    <path d="M172,302 C168,324 158,348 144,366 C140,371 136,368 139,363 C150,346 158,324 164,302 Z" fill="#AEC0C9"/>

    <!-- Plume 4: Soft Grounding Ribbon (Soft Olive) -->
    <path d="M166,298 C160,314 148,332 134,346 C130,350 127,347 130,342 C142,330 152,314 158,298 Z" fill="#BDC0A8"/>

    <!-- BOTANICAL OLIVE / HEALING SPROUT AT BASE (Nourishment & Renewal) -->
    <!-- Sprout Stem -->
    <path d="M195,335 C208,338 222,340 238,340" stroke="#BDC0A8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Leaf 1 (Sage Green) -->
    <path d="M212,334 C222,326 238,328 248,335 C252,338 247,343 241,341 C228,338 218,337 212,334 Z" fill="#9AA78A"/>
    <!-- Leaf 2 (Soft Olive) -->
    <path d="M225,340 C234,345 246,354 252,364 C254,367 249,370 245,366 C238,358 230,350 225,340 Z" fill="#BDC0A8"/>

    <!-- Subtle Luminary Node (Inner Transformation Spark) -->
    <circle cx="218" cy="225" r="3" fill="#BDC0A8"/>
    <circle cx="218" cy="225" r="1.5" fill="#FDFDFD"/>
