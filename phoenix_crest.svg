<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crestNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3A52"/>
      <stop offset="100%" stop-color="#132E42"/>
    </linearGradient>
    <linearGradient id="crestSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7B597"/>
      <stop offset="100%" stop-color="#8F9D7F"/>
    </linearGradient>
    <linearGradient id="crestBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BDCED7"/>
      <stop offset="100%" stop-color="#A2B5BF"/>
    </linearGradient>
  </defs>

  <g id="phoenix-luxury-crest" transform="translate(0, 10)">
    <!-- Delicate orbital halo / balance ring -->
    <circle cx="200" cy="180" r="145" fill="none" stroke="#BDC0A8" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.45"/>
    <circle cx="200" cy="180" r="158" fill="none" stroke="#132E42" stroke-width="0.5" opacity="0.2"/>
    <circle cx="200" cy="35" r="3" fill="#9AA78A"/>
    <circle cx="345" cy="118" r="2.5" fill="#AEC0C9"/>
    <circle cx="55" cy="118" r="2.5" fill="#AEC0C9"/>

    <!-- LEFT WING CLUSTER -->
    <!-- Feather L1 - Outer Rising Flight Feather (Navy) -->
    <!-- Curves out and up, then gently tips inward -->
    <path d="M190,165 C175,130 145,80 112,52 C98,40 86,45 88,52 C92,66 116,102 142,138 C164,168 180,188 188,198 Z" 
          fill="url(#crestNavy)"/>
    <!-- Feather L2 - Upper Secondary Feather (Navy) -->
    <path d="M188,178 C168,142 134,96 102,74 C92,67 86,72 90,78 C98,95 124,128 148,158 C168,184 180,198 186,206 Z" 
          fill="#132E42"/>
    <!-- Feather L3 - Botanical Leaf Feather (Sage Green) -->
    <path d="M186,192 C168,162 138,124 114,106 C106,100 102,105 106,112 C116,128 142,156 162,182 C174,198 182,210 184,216 Z" 
          fill="url(#crestSage)"/>
    <!-- Feather L4 - Serenity Inner Feather (Dusty Blue) -->
    <path d="M184,204 C168,180 144,148 128,135 C122,130 118,135 122,141 C132,154 152,178 168,200 C176,210 181,218 183,222 Z" 
          fill="url(#crestBlue)"/>
    <!-- Feather L5 - Grounding Feather (Soft Olive) -->
    <path d="M183,215 C170,196 152,172 142,162 C137,157 134,161 138,166 C147,178 162,198 174,215 C178,222 181,226 182,228 Z" 
          fill="#BDC0A8"/>

    <!-- RIGHT WING CLUSTER (Mirrored with dynamic subtle variance) -->
    <!-- Feather R1 - Outer Rising Flight Feather (Navy) -->
    <path d="M210,165 C225,130 255,80 288,52 C302,40 314,45 312,52 C308,66 284,102 258,138 C236,168 220,188 212,198 Z" 
          fill="url(#crestNavy)"/>
    <!-- Feather R2 - Upper Secondary Feather (Navy) -->
    <path d="M212,178 C232,142 266,96 298,74 C308,67 314,72 310,78 C302,95 276,128 252,158 C232,184 220,198 214,206 Z" 
          fill="#132E42"/>
    <!-- Feather R3 - Botanical Leaf Feather (Sage Green) -->
    <path d="M214,192 C232,162 262,124 286,106 C294,100 298,105 294,112 C284,128 258,156 238,182 C226,198 218,210 216,216 Z" 
          fill="url(#crestSage)"/>
    <!-- Feather R4 - Serenity Inner Feather (Dusty Blue) -->
    <path d="M216,204 C232,180 256,148 272,135 C278,130 282,135 278,141 C268,154 248,178 232,200 C224,210 219,218 217,222 Z" 
          fill="url(#crestBlue)"/>
    <!-- Feather R5 - Grounding Feather (Soft Olive) -->
    <path d="M217,215 C230,196 248,172 258,162 C263,157 266,161 262,166 C253,178 238,198 226,215 C222,222 219,226 218,228 Z" 
          fill="#BDC0A8"/>

    <!-- PHOENIX HEAD & CREST -->
    <!-- Crown Crest: Triple Feather Plume -->
    <!-- Plume Center (Deep Navy) -->
    <path d="M200,82 C200,64 203,42 208,26 C210,21 213,22 212,27 C208,44 204,64 203,84 Z" fill="#132E42"/>
    <!-- Plume Left (Sage Green) -->
    <path d="M198,84 C195,68 188,48 180,34 C177,30 181,28 184,31 C193,44 198,64 199,85 Z" fill="#9AA78A"/>
    <!-- Plume Right (Dusty Blue) -->
    <path d="M202,84 C206,70 214,54 224,42 C227,39 229,42 227,45 C219,57 212,72 205,86 Z" fill="#AEC0C9"/>

    <!-- Regal Head Silhouette (Facing Right with upward poise) -->
    <path d="M196,90 C196,80 203,76 210,79 C216,82 222,86 228,88 C232,89 231,92 227,93 C220,95 216,98 214,105 C210,114 206,122 204,130 C201,128 198,122 197,114 C196,104 196,96 196,90 Z" fill="#132E42"/>
    <circle cx="206" cy="87" r="1.3" fill="#FDFDFD"/>

    <!-- CENTRAL TORSO & HEART (Harmonious heart-shaped breast tapering down) -->
    <path d="M197,130 C193,142 188,162 188,185 C188,212 194,235 200,248 C206,235 212,212 212,185 C212,162 207,142 203,130 Z" 
          fill="url(#crestNavy)"/>

    <!-- Transformation Core (Inner balance light) -->
    <circle cx="200" cy="188" r="3" fill="#BDC0A8"/>
    <circle cx="200" cy="202" r="2.2" fill="#AEC0C9"/>

    <!-- TAIL PLUMAGE (Fan of renewal plumes cascading down) -->
    <!-- Tail Plume Center (Navy) -->
    <path d="M200,248 C202,272 203,308 201,348 C200,354 198,354 197,348 C196,308 198,272 200,248 Z" 
          fill="#132E42"/>

    <!-- Tail Plume Left 1 (Sage Green) -->
    <path d="M198,250 C192,276 182,310 165,338 C161,344 157,341 160,335 C174,310 186,278 196,250 Z" 
          fill="url(#crestSage)"/>
    <!-- Tail Plume Right 1 (Sage Green) -->
    <path d="M202,250 C208,276 218,310 235,338 C239,344 243,341 240,335 C226,310 214,278 204,250 Z" 
          fill="url(#crestSage)"/>

    <!-- Tail Plume Left 2 (Dusty Blue) -->
    <path d="M196,252 C186,280 168,312 144,334 C139,339 135,335 138,330 C156,310 174,280 192,252 Z" 
          fill="url(#crestBlue)"/>
    <!-- Tail Plume Right 2 (Dusty Blue) -->
    <path d="M204,252 C214,280 232,312 256,334 C261,339 265,335 262,330 C244,310 226,280 208,252 Z" 
          fill="url(#crestBlue)"/>

    <!-- GROUNDED BOTANICAL OLIVE LEAVES (Clinical Nutrition & Earth) -->
    <path d="M198,266 C184,272 168,284 158,298 C154,304 161,306 166,301 C178,289 191,277 198,266 Z" 
          fill="#BDC0A8"/>
    <path d="M202,266 C216,272 232,284 242,298 C246,304 239,306 234,301 C222,289 209,277 202,266 Z" 
          fill="#BDC0A8"/>

    <!-- Celestial Nodes -->
    <circle cx="200" cy="358" r="3" fill="#9AA78A"/>
    <circle cx="160" cy="342" r="2.5" fill="#AEC0C9"/>
    <circle cx="240" cy="342" r="2.5" fill="#AEC0C9"/>
  </g>
</svg>
