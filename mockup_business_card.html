<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Luxury Business Card Mockup - Dr. Alaa Mahdy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ECEFF1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
      font-family: 'Inter', sans-serif;
    }

    .cards-wrapper {
      display: flex;
      gap: 50px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Standard Luxury Business Card: 3.5 x 2 inches -> 560 x 320 px */
    .card {
      width: 540px;
      height: 310px;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(19, 46, 66, 0.16), 0 10px 25px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 42px;
      transition: transform 0.3s ease;
    }

    /* CARD FRONT: Soft White Editorial Luxury */
    .card-front {
      background: #FDFDFD;
      border: 1px solid rgba(189, 192, 168, 0.45);
    }

    .card-front::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 140px;
      height: 100%;
      background: linear-gradient(90deg, rgba(253, 253, 253, 0) 0%, rgba(174, 192, 201, 0.1) 100%);
      pointer-events: none;
    }

    .front-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .front-symbol svg {
      width: 58px;
      height: 58px;
    }

    .front-badge {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9AA78A;
      font-weight: 600;
      border-bottom: 1px solid rgba(154, 167, 138, 0.4);
      padding-bottom: 4px;
    }

    .front-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 700;
      color: #132E42;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .card-title {
      font-size: 11px;
      font-weight: 500;
      color: #132E42;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .card-specialty {
      font-family: 'Alexandria', sans-serif;
      font-size: 10.5px;
      color: #9AA78A;
      margin-top: 2px;
      font-weight: 400;
    }

    /* CARD BACK: Deep Navy Nocturne with Soft Olive & Dusty Blue */
    .card-back {
      background: #132E42;
      border: 1px solid rgba(189, 192, 168, 0.3);
      color: #FDFDFD;
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(189, 192, 168, 0.28);
      border-radius: 8px;
      pointer-events: none;
    }

    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .back-logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: #FDFDFD;
    }

    .back-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: #AEC0C9;
    }

    .back-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 2;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: #FDFDFD;
      opacity: 0.92;
      font-weight: 400;
    }

    .contact-item i {
      color: #BDC0A8;
      font-size: 11px;
      width: 14px;
    }

    .qr-mockup {
      width: 68px;
      height: 68px;
      background: #FDFDFD;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-mockup svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="cards-wrapper">
    <!-- FRONT -->
    <div class="card card-front">
      <div class="front-top">
        <div class="front-symbol">
          <svg viewBox="0 0 400 400" width="56" height="56">
            <circle cx="200" cy="180" r="140" fill="none" stroke="#BDC0A8" stroke-width="1.8" stroke-dasharray="3 4"
              opacity="0.6" />
            <path d="M190,165 C175,130 145,80 112,52 C88,52 116,102 142,138 Z" fill="#132E42" />
            <path d="M210,165 C225,130 255,80 288,52 C312,52 284,102 258,138 Z" fill="#132E42" />
            <path d="M186,192 C168,162 138,124 114,106 C116,128 142,156 162,182 Z" fill="#9AA78A" />
            <path d="M214,192 C232,162 262,124 286,106 C284,128 258,156 238,182 Z" fill="#9AA78A" />
            <path d="M184,204 C168,180 144,148 128,135 C132,154 152,178 168,200 Z" fill="#AEC0C9" />
            <path d="M216,204 C232,180 256,148 272,135 C268,154 248,178 232,200 Z" fill="#AEC0C9" />
            <path d="M196,90 C196,80 203,76 210,79 C220,85 228,88 227,93 C216,98 214,105 204,130 Z" fill="#132E42" />
            <circle cx="206" cy="87" r="1.5" fill="#FDFDFD" />
            <path d="M197,130 C193,142 188,162 188,185 C200,248 212,185 203,130 Z" fill="#132E42" />
            <path d="M200,248 C202,272 203,308 201,348 C196,308 198,272 200,248 Z" fill="#132E42" />
            <path d="M198,250 C192,276 182,310 165,338 C174,310 186,278 196,250 Z" fill="#9AA78A" />
            <path d="M202,250 C208,276 218,310 235,338 C226,310 214,278 204,250 Z" fill="#9AA78A" />
          </svg>
        </div>
        <span class="front-badge">Executive Stationery</span>
      </div>

      <div class="front-bottom">
        <h2 class="card-name">Dr. Alaa Mahdy</h2>
        <p class="card-title">Pharmacist &amp; Clinical Nutritionist</p>
        <p class="card-specialty">صيدلانية وتغذية علاجية • تنظيم الجهاز العصبي والوعي الداخلي</p>
      </div>
    </div>

    <!-- BACK -->
    <div class="card card-back">
      <div class="back-header">
        <span class="back-logo-text">Dr. Alaa Mahdy</span>
        <span class="back-quote">“Renewal begins from within”</span>
      </div>

      <div class="back-content">
        <div class="contact-list">
          <div class="contact-item">
            <i class="fa-solid fa-globe"></i>
            <span>dralaamahdy.com</span>
          </div>
          <div class="contact-item">
            <i class="fa-solid fa-envelope"></i>
            <span>contact@dralaamahdy.com</span>
          </div>
          <div class="contact-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>+20 102 404 9463</span>
          </div>
          <div class="contact-item">
            <i class="fa-brands fa-instagram"></i>
            <span>@dr.alaamahdy</span>
          </div>
        </div>

        <div class="qr-mockup">
          <!-- Stylized QR Code vector -->
          <svg viewBox="0 0 100 100" fill="#132E42">
            <rect x="10" y="10" width="28" height="28" fill="#132E42" rx="4" />
            <rect x="16" y="16" width="16" height="16" fill="#FDFDFD" rx="2" />
            <rect x="20" y="20" width="8" height="8" fill="#132E42" />

            <rect x="62" y="10" width="28" height="28" fill="#132E42" rx="4" />
            <rect x="68" y="16" width="16" height="16" fill="#FDFDFD" rx="2" />
            <rect x="72" y="20" width="8" height="8" fill="#132E42" />

            <rect x="10" y="62" width="28" height="28" fill="#132E42" rx="4" />
            <rect x="16" y="68" width="16" height="16" fill="#FDFDFD" rx="2" />
            <rect x="20" y="72" width="8" height="8" fill="#132E42" />

            <!-- Micro dots -->
            <rect x="46" y="15" width="8" height="8" rx="2" />
            <rect x="46" y="30" width="8" height="8" rx="2" />
            <rect x="46" y="65" width="8" height="8" rx="2" />
            <rect x="62" y="46" width="8" height="8" rx="2" />
            <rect x="76" y="60" width="14" height="14" rx="2" />
            <rect x="62" y="78" width="8" height="8" rx="2" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
