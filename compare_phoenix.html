<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 40px; background: #FDFDFD; font-family: sans-serif; display: flex; gap: 40px; }
    .box { width: 400px; height: 400px; border: 1px solid #eee; background: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h3 { margin-top: 10px; color: #132E42; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Variation A: Graceful Profile Editorial Phoenix (Inspired by the Anuna emblem in Image 5, with leaf-curves and rising wings) -->
  <div class="box">
    <svg id="phoenix-a" viewBox="0 0 300 300" width="260" height="260">
      <!-- Crown plume -->
      <path d="M152,72 C158,58 170,44 182,38 C185,36 186,39 183,42 C172,52 165,66 160,80 Z" fill="#9AA78A" />
      <path d="M148,76 C155,62 168,52 178,48 C181,47 180,50 177,53 C168,62 160,74 154,84 Z" fill="#132E42" />

      <!-- Head & Beak & Neck -->
      <!-- Head curve with beak facing right -->

      <!-- Back Wing (Secondary layer peeking from behind) -->

      <path d="M125,125 C118,102 108,80 98,65 C95,61 99,60 102,63 C115,80 126,105 132,130 Z" fill="#9AA78A" opacity="0.85" />

      <!-- Main Wing - Feather 2 (Sage Green Leaf Curve) -->
      <path d="M132,175 C120,152 102,122 86,98 C81,90 77,86 81,81 C84,77 91,80 97,88 C115,112 132,148 140,180 Z" fill="#9AA78A" />

      <!-- Main Wing - Feather 3 (Dusty Blue) -->

      <!-- Flowing Tail Plumes (Long cascading elegant curves) -->

      <path d="M135,218 C138,235 142,255 148,272 C150,278 147,280 144,276 C136,262 128,242 126,220 Z" fill="#132E42" />
      <!-- Plume 2 - Sage Green sweeping forward -->
      <path d="M132,222 C134,242 135,264 128,282 C126,288 122,286 123,280 C126,262 126,242 124,222 Z" fill="#9AA78A" />
      <!-- Plume 3 - Dusty Blue accent -->

      <!-- Botanical Laurel / Olive Leaves at base (Renewal & Nourishment) -->
      <!-- Leaf 1 -->
      <path d="M148,245 C158,240 172,242 180,248 C184,251 180,255 174,254 C162,253 152,249 148,245 Z" fill="#9AA78A" />
      <!-- Leaf 2 -->
      <path d="M142,258 C152,256 164,262 170,270 C173,274 168,277 163,274 C153,270 145,263 142,258 Z" fill="#BDC0A8" />

      <!-- Subtle Golden/Olive Center Dot -->
      <circle cx="145" cy="158" r="2.5" fill="#BDC0A8" />
    </svg>
    <h3>Option A: Dynamic Graceful Phoenix</h3>
  </div>

      <path d="M150,225 C162,226 178,235 185,245 C189,250 183,252 178,248 C168,240 156,231 150,225 Z" fill="#BDC0A8" />
    </svg>
    <h3>Option B: Symmetrical Botanical Phoenix</h3>
  </div>
</body>
