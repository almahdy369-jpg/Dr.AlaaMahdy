<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <title>Instagram Reel Cover - Dr. Alaa Mahdy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #EAEFF2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Alexandria', sans-serif;
      padding: 40px;
    }

    /* 9:16 Reel Cover Ratio (e.g. 540x960 px) */
    .reel-frame {
      width: 480px;
      height: 853px;
      position: relative;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(19, 46, 66, 0.22);
      border: 8px solid #132E42;
      background: #FDFDFD;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Background image with editorial warm tint and botanical gradient */
    .reel-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      z-index: 1;
    }

    /* Luxury Editorial Gradients over image */
    .reel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg,
          rgba(19, 46, 66, 0.75) 0%,
          rgba(19, 46, 66, 0.1) 35%,
          rgba(253, 253, 253, 0.0) 50%,
          rgba(19, 46, 66, 0.85) 80%,
          rgba(19, 46, 66, 0.98) 100%);
      z-index: 2;
    }

    /* Top Reel Header */
    .reel-header {
      position: relative;
      z-index: 3;
      padding: 32px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reel-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(253, 253, 253, 0.92);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(189, 192, 168, 0.5);
    }

    .reel-brand svg {
      width: 26px;
      height: 26px;
    }

    .reel-brand span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 700;
      color: #132E42;
      letter-spacing: 0.04em;
    }

    .reel-series-badge {
      background: rgba(19, 46, 66, 0.7);
      backdrop-filter: blur(8px);
      color: #FDFDFD;
      border: 1px solid rgba(174, 192, 201, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Center Play Badge Preview */
    .center-reel-badge {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(253, 253, 253, 0.25);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(253, 253, 253, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FDFDFD;
      font-size: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Bottom Reel Editorial Content */
    .reel-footer {
      position: relative;
      z-index: 3;
      padding: 0 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tag-row {
      display: flex;
      gap: 8px;
    }

    .tag {
      font-size: 10px;
      background: rgba(154, 167, 138, 0.25);
      border: 1px solid #9AA78A;
      color: #BDC0A8;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .reel-title {
      color: #FDFDFD;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .reel-title span {
      color: #AEC0C9;
    }

    .reel-author-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(174, 192, 201, 0.25);
      padding-top: 14px;
      margin-top: 4px;
    }

    .author-name-group h3 {
      font-size: 14px;
      font-weight: 600;
      color: #FDFDFD;
    }

    .author-name-group p {
      font-size: 10.5px;
      color: #AEC0C9;
      font-weight: 400;
    }

    .watch-cta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #BDC0A8;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="reel-frame">
    <!-- Background Image -->
    <img src="file:///c:/Users/ou/Desktop/Portfolio/assets/images/dr_alaa.jpg" alt="Dr. Alaa Mahdy"
      class="reel-bg-image">
    <div class="reel-overlay"></div>

    <!-- Top Bar -->
    <div class="reel-header">
      <div class="reel-brand">
        <!-- Embedded Mini Phoenix -->
        <svg viewBox="0 0 400 400" width="24" height="24">
          <circle cx="200" cy="180" r="140" fill="none" stroke="#BDC0A8" stroke-width="2" stroke-dasharray="3 4" />
          <!-- Wings -->
          <path d="M190,165 C175,130 145,80 112,52 C88,52 116,102 142,138 Z" fill="#132E42" />
          <path d="M210,165 C225,130 255,80 288,52 C312,52 284,102 258,138 Z" fill="#132E42" />
          <path d="M186,192 C168,162 138,124 114,106 C116,128 142,156 162,182 Z" fill="#9AA78A" />
          <path d="M214,192 C232,162 262,124 286,106 C284,128 258,156 238,182 Z" fill="#9AA78A" />
          <!-- Head -->
          <path d="M196,90 C196,80 203,76 210,79 C220,85 228,88 227,93 C216,98 214,105 204,130 Z" fill="#132E42" />
          <path d="M197,130 C193,142 188,162 188,185 C200,248 212,185 203,130 Z" fill="#132E42" />
          <path d="M200,248 C202,272 203,308 201,348 C196,308 198,272 200,248 Z" fill="#132E42" />
        </svg>
        <span>Dr. Alaa Mahdy</span>
      </div>
      <div class="reel-series-badge">
        <i class="fa-solid fa-sparkles"></i>
        <span>سلسلة الوعي العصبي</span>
      </div>
    </div>

    <!-- Center Play Icon -->
    <div class="center-reel-badge">
      <i class="fa-solid fa-play" style="margin-right: -2px;"></i>
    </div>

    <!-- Bottom Editorial Card -->
    <div class="reel-footer">
      <div class="tag-row">
        <span class="tag">إعادة ضبط التوازن</span>
        <span class="tag">التغذية العلاجية</span>
      </div>

      <h2 class="reel-title">
        لماذا تفشل الحميات التقليدية عندما يكون <span>جهازك العصبي في حالة إنذار؟</span>
      </h2>

      <div class="reel-author-bar">
        <div class="author-name-group">
          <h3>د. آلاء مهدي</h3>
          <p>صيدلانية وأخصائية تغذية علاجية وتنظيم عصبي</p>
        </div>
        <div class="watch-cta">
          <span>شاهد المقطع</span>
          <i class="fa-solid fa-arrow-left"></i>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
